# ci.yml - Validates the dotfiles repo in CI
#
# One job per concern; each one just runs a Makefile target, so the same
# checks reproduce locally:
#   stow   make install semantics (temporary HOME, both OSes)
#   lint   make lint (shellcheck + zsh -n)
#
# `make check-brewfile` runs weekly instead - see brewfile.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # `brew install stow` would otherwise auto-update the taps first.
  HOMEBREW_NO_AUTO_UPDATE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stow:
    name: stow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stow
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install stow
          else
            sudo apt-get update
            sudo apt-get install -y stow
          fi

      - name: Check stow into a throwaway HOME
        run: make check-home

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck + zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: make lint
        run: make lint

  # Same scan as the pre-commit hook, but over the whole history, so a commit
  # made with --no-verify or from a machine without the hook still gets caught.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned on purpose: bump by hand, like the action SHAs above.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads commits, not just the worktree

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks git
        run: gitleaks git --redact --verbose
